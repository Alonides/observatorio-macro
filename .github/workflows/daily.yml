name: Daily macro ingestion

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-macro-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/collect.py
      - name: Commit daily snapshot
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "observatorio-bot"
          git config user.email "observatorio-bot@users.noreply.github.com"
          git add -- data/latest.json data/series.json
          git commit -m "data: actualización diaria [skip ci]"
          git push
