name: Debt and NOK backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: Historical start date
        required: false
        default: "2006-01-01"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/backtest_regimes.py --fetch --start "${{ inputs.start }}"
      - uses: actions/upload-artifact@v4
        with:
          name: debt-nok-backtest
          path: |
            data/backtest_series.json
            data/regime_backtest.json
