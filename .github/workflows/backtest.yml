name: Debt and NOK backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: Historical start date
        required: false
        default: "2006-01-01"
  pull_request:
    paths:
      - ".github/workflows/backtest.yml"
      - "scripts/backtest_regimes.py"
      - "src/observatorio/backtest.py"
      - "src/observatorio/history.py"
      - "src/observatorio/regime.py"
      - "src/observatorio/scenarios.py"
      - "tests/test_backtest.py"
      - "tests/test_history.py"
      - "tests/test_regime.py"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/backtest_regimes.py --fetch --start "${{ github.event.inputs.start || '2006-01-01' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debt-nok-backtest
          path: |
            data/backtest_series.json
            data/regime_backtest.json
          if-no-files-found: warn
